# AgroPasco — Blueprint de Despliegue en Render (Infrastructure as Code)
# =====================================================================
# Define los dos servicios desacoplados:
#   1. agropasco-ml-service: Microservicio Python FastAPI de Machine Learning
#   2. agropasco-platform: Backend Node.js Express + Frontend SPA

services:
  # -------------------------------------------------------------
  # 1. Microservicio de Inferencia de Machine Learning (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: agropasco-ml-service
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ML_SERVICE_HOST
        value: 0.0.0.0

  # -------------------------------------------------------------
  # 2. Plataforma Principal AgroPasco (Node.js Express + Web SPA)
  # -------------------------------------------------------------
  - type: web
    name: agropasco-platform
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: agropasco-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/agropasco.db
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: agropasco-ml-service
          property: host
