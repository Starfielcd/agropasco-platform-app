<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgroPasco Digital - Plataforma Agrícola Inteligente para la Región Pasco, Perú. Monitoreo climático, asesoría agrícola, trazabilidad digital y conexión con supermercados.">
  <meta name="keywords" content="agricultura, Pasco, Cerro de Pasco, cultivos, clima, heladas, maca, papa, trazabilidad, supermercado">
