<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgroPasco Digital - Plataforma Agrícola Inteligente para la Región Pasco, Perú. Monitoreo climático, asesoría agrícola, trazabilidad digital y conexión con supermercados.">
  <meta name="keywords" content="agricultura, Pasco, Cerro de Pasco, cultivos, clima, heladas, maca, papa, trazabilidad, supermercado">
  <meta name="author" content="AgroPasco Digital">
  <title>AgroPasco Digital — Plataforma Agrícola Inteligente</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

  <!-- AgroPasco Styles -->
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Loading state (Natural Modern) -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; background: #F7FAF6;">
      <div style="width: 72px; height: 72px; border-radius: 20px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; font-size: 38px; animation: pulse 2s infinite; box-shadow: 0 8px 24px rgba(22, 163, 74, 0.15);">
        🌿
      </div>
      <div style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: #166534; letter-spacing: -0.5px;">AgroPasco Digital</div>
      <div style="color: #64748B; font-size: 13.5px; font-weight: 500;">Cargando plataforma agrícola...</div>
    </div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Leaflet Draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Map Services -->
  <script src="frontend/services/maps/config.js"></script>
  <script src="frontend/services/maps/leafletMap.js"></script>
  <script src="frontend/services/maps/geocoding.js"></script>
  <script src="frontend/services/maps/pascoAdminGeo.js"></script>
  <script src="frontend/services/maps/routing.js"></script>

  <!-- Chart.js para Visualización Predictiva Interactiva (Fase 3) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Frontend Core Modules -->
  <script src="frontend/js/logger.js"></script>
  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/auth.js"></script>
  <script src="frontend/js/dashboard.js"></script>
  <script src="frontend/js/weather.js"></script>
  <script src="frontend/js/ml-monitor.js"></script>
  <script src="frontend/js/predictive-dashboard.js"></script>
  <script src="frontend/js/monte-carlo-simulator.js"></script>
  <script src="frontend/js/mitigation-strategies.js"></script>
  <script src="frontend/js/multi-agent-system.js"></script>
  <script src="frontend/js/crops.js"></script>
  <script src="frontend/js/advisory.js"></script>
  <script src="frontend/js/traceability.js"></script>
  <script src="frontend/js/media-uploader.js"></script>
  <script src="frontend/js/supermarket.js"></script>

  <!-- Role-Specific Modules -->
  <script src="frontend/js/parcels.js"></script>
  <script src="frontend/js/pest-reports.js"></script>
  <script src="frontend/js/advisor-panel.js"></script>
  <script src="frontend/js/logistics.js"></script>
  <script src="frontend/js/admin-panel.js"></script>

  <!-- App Router (must be last) -->
  <script src="frontend/js/app.js"></script>
</body>
</html>
